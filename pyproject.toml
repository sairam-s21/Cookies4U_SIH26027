[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "railblock"
version = "0.1.0"
description = "AI-Powered Automatic Block Planning (SIH PS 26027) - MAS-CBE corridor"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
