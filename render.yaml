# Minimal one-click backend deployment for Render (https://render.com).
# The frontend is hosted separately on Vercel; this FastAPI + OR-Tools
# backend needs its own host since Vercel doesn't run long-lived Python
# services. After deploying, set the Vercel project's VITE_API_BASE_URL
# env var to this service's real URL (shown in the Render dashboard).
#
# CORS is already permissive (allow_origins=["*"]) in src/railblock/api/app.py,
# so no extra config is needed for the cross-origin Vercel -> Render calls.
#
# The real railway-sourced data files this app needs (tasks.csv, two
# datasets/ CSVs, and a handful of data/derived/ files -- see .gitignore
# for the exact list) live in a separate PRIVATE repo, never this public
# one. The build step below runs scripts/fetch_private_data.sh to pull
# them in. PRIVATE_DATA_REPO/DATASETS_REPO_TOKEN must both be set in the
# Render dashboard -- see DEPLOY.md for the one-time setup. Both are
# `sync: false` (not a plain `value:`) so Render prompts for them in the
# dashboard and never stores either in this file, which IS committed to
# the public repo -- a plain `value:` here would also just get re-synced
# from this file on every deploy, silently overwriting a dashboard edit.
#
# CP-SAT's defaults (8 search workers x up to 3 concurrent strategies --
# see config.py) are tuned for a real multi-core dev machine, which
# Render's free plan (~0.1 CPU / 512MB) is not: a single /schedule/options
# call there can starve the ENTIRE instance, stalling or failing every
# other request while one solve is running. These three overrides only
# apply to THIS deployment (local dev and any better-resourced host keep
# the code's real defaults): 2 search workers instead of 8, the 3
# strategies run ONE AT A TIME instead of concurrently (bounding peak
# concurrent CPU demand, not just total wall time), and a lower 12s
# per-strategy budget so the sequential total (~36s worst case) doesn't
# land far past the old concurrent one.
services:
  - type: web
    name: railblock-api
    runtime: python
    plan: free
    buildCommand: bash scripts/fetch_private_data.sh && pip install -r requirements.txt
    startCommand: uvicorn railblock.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: railblock-db
          property: connectionString
      - key: PYTHONPATH
        value: src
      - key: PRIVATE_DATA_REPO
        sync: false
      - key: DATASETS_REPO_TOKEN
        sync: false
      - key: CPSAT_SEARCH_WORKERS
        value: "2"
      - key: SCHEDULE_OPTIONS_MAX_CONCURRENCY
        value: "1"
      - key: SCHEDULE_OPTIONS_TIME_LIMIT_S
        value: "12"

databases:
  - name: railblock-db
    plan: free
